<div class="modal fade" id="modal-info-contract" tabindex="-1" role="dialog" aria-labelledby="modal-info-contract" aria-hidden="true">
    <div class="modal-dialog modal- modal-dialog-centered modal-" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h4  class="text-gradient text-info text-gradient font-weight-bold text-uppercase">Información de usuario</h4>
          <button type="button" class="btn-close text-dark" data-bs-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div class="modal-body">
          <ul class="list-group list-group-flush mt-2">
            <li class="list-group-item">Folio: <b>{{ contract?.folio }}</b></li>
            <li class="list-group-item">Dispositivos: <b>{{ contract?.device }}</b></li>
            <li class="list-group-item">Teléfono: <b>{{ contract?.phone }}</b></li>
            <li class="list-group-item">Fecha de Expiraación: <b>{{ contract?.expiresDate| date:'dd/MM/yyyy - h:mm a' }}</b></li>
            <li class="list-group-item"></li>
         </ul>

          <hr>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link bg-gradient-info ml-auto" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
