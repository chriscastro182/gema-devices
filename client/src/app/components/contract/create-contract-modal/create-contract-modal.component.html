<div class="modal fade" id="CreateModal" tabindex="-1" role="dialog" aria-labelledby="CreateModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h4  class="text-gradient text-success text-gradient font-weight-bold text-uppercase">Agregar Usuario</h4>
          <button type="button" class="btn-close text-dark" data-bs-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div class="modal-body">
          <form>
            <div class="form-group">
              <label for="nombre-name" class="col-form-label">Folio:</label>
              <input type="text" class="form-control" name="Folio" [(ngModel)]="contrato.folio" id="nombre-name">
            </div>
            <div class="form-group">
              <label for="nombre-name" class="col-form-label">Teléfono:</label>
              <input type="text" class="form-control" name="Teléfono" [(ngModel)]="contrato.phone" id="nombre-lastname">
            </div>
            <div class="form-group">
              <label for="nombre-name" class="col-form-label">Fecha de Expiración:</label>
              <input type="date" class="form-control" name="date" [(ngModel)]="contrato.expiresDate" id="nombre-email">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn bg-gradient-dark" data-bs-dismiss="modal">Cerrar</button>
          <button (click)="createUser()" type="button" class="btn bg-gradient-success" data-bs-dismiss="modal">Crear</button>
        </div>
      </div>
    </div>
</div>
